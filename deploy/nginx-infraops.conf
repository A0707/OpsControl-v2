# nginx devant InfraOps sur la VM. InfraOps n'a PAS d'authentification propre :
# sur le réseau, c'est cette configuration qui protège l'accès. Ne jamais
# exposer uvicorn directement.

# Quota par adresse cliente (contexte http : ce fichier est inclus depuis sites-enabled).
# Complète les quotas applicatifs d'access_policy.py, sans les remplacer.
limit_req_zone $binary_remote_addr zone=infraops:10m rate=20r/s;
# Flux SSE simultanés par adresse : complète le plafond applicatif par acteur (audit SEC-08).
limit_conn_zone $binary_remote_addr zone=infraops_sse:10m;

# HTTP : redirection vers HTTPS uniquement, aucun contenu servi en clair.
server {
    listen 80;
    server_name infraops.example.test;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name infraops.example.test;
    server_tokens off;
    # Le navigateur refuse ensuite tout accès en clair à ce nom (un an).
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate     /etc/nginx/tls/infraops.crt;
    ssl_certificate_key /etc/nginx/tls/infraops.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Corps de requête : les formulaires d'OpsControl tiennent en quelques Ko ; 256 Ko
    # bornent explicitement ce que l'application doit lire (audit SEC-09).
    client_max_body_size 256k;

    # Postes d'exploitation autorisés (à adapter).
    allow 10.77.0.0/24;
    deny all;

    # Authentification sur l'annuaire via oauth2-proxy (ou Authelia).
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header X-Original-URI $request_uri;
    }
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
    }

    # Webhook Zabbix : pas d'authentification annuaire (appel serveur à serveur),
    # mais uniquement depuis le serveur Zabbix ET avec le jeton vérifié par InfraOps.
    location = /api/webhooks/zabbix {
        allow 10.77.0.0/32;   # REMPLACER par l'IP du serveur Zabbix
        deny all;
        client_max_body_size 64k;
        # Appel machine : aucune identité opérateur ne doit transiter.
        proxy_set_header X-OpsControl-User "";
        proxy_set_header X-OpsControl-Proxy "";
        # IP cliente réelle : REMPLACE tout X-Forwarded-For envoyé par le client (uvicorn
        # --proxy-headers lui fait confiance) ; sinon l'adresse de l'audit est falsifiable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }

    # Identité opérateur : oauth2-proxy (--set-xauthrequest) renvoie X-Auth-Request-Email.
    # nginx la transmet avec le secret partagé ; proxy_set_header REMPLACE tout en-tête
    # de même nom envoyé par le navigateur : un client ne peut pas se déclarer lui-même.
    # snippets/infraops-proxy-secret.conf est créé par install-vm.sh (0640, jamais affiché).

    # Métriques internes : lues en local par l'agent Zabbix (127.0.0.1:8000), jamais
    # exposées par le proxy, même à un utilisateur authentifié.
    location = /api/metrics {
        return 404;
    }

    # Flux temps réel : sans tampon, sinon les événements arrivent par paquets.
    location = /api/events {
        limit_conn infraops_sse 6;
        limit_conn_status 429;
        auth_request /oauth2/auth;
        auth_request_set $ops_user $upstream_http_x_auth_request_email;
        proxy_set_header X-OpsControl-User $ops_user;
        include /etc/nginx/snippets/infraops-proxy-secret.conf;
        # Corrélation journal nginx ↔ audit OpsControl (X-Request-ID repris par access_policy).
        proxy_set_header X-Request-ID $request_id;
        # IP cliente réelle : REMPLACE tout X-Forwarded-For envoyé par le client (uvicorn
        # --proxy-headers lui fait confiance) ; sinon l'adresse de l'audit est falsifiable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        # Pas sur /api/events : un flux SSE est une seule requête longue.
        limit_req zone=infraops burst=40 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $ops_user $upstream_http_x_auth_request_email;
        proxy_set_header X-OpsControl-User $ops_user;
        include /etc/nginx/snippets/infraops-proxy-secret.conf;
        # Corrélation journal nginx ↔ audit OpsControl (X-Request-ID repris par access_policy).
        proxy_set_header X-Request-ID $request_id;
        # IP cliente réelle : REMPLACE tout X-Forwarded-For envoyé par le client (uvicorn
        # --proxy-headers lui fait confiance) ; sinon l'adresse de l'audit est falsifiable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # InfraOps compare l'en-tête Origin à son URL de base : même hôte requis.
        proxy_set_header X-Forwarded-Proto https;
    }
}
