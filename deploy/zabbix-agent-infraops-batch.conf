# Paramètres utilisateur de l'agent Zabbix : résultats des batchs InfraOps.
# À copier dans /etc/zabbix/zabbix_agentd.d/infraops-batch.conf (Debian et
# CentOS : même dossier, déjà inclus par zabbix_agentd.conf), puis redémarrer
# l'agent. Compatible agent 4.0 (prddcyjob02) et 6.4 (prdlabjob06).
#
# Lecture seule : ces commandes lisent /var/lib/infraops-batch/*.state et
# n'exécutent rien d'autre. Le nom de batch est validé par le script avant
# tout accès fichier (lettres, chiffres, _ . - ; pas de chemin).
UserParameter=infraops.batch.discovery,/usr/local/bin/infraops-batch-report --discovery
UserParameter=infraops.batch.rc[*],/usr/local/bin/infraops-batch-report --get "$1" rc
UserParameter=infraops.batch.started[*],/usr/local/bin/infraops-batch-report --get "$1" started
UserParameter=infraops.batch.finished[*],/usr/local/bin/infraops-batch-report --get "$1" finished
UserParameter=infraops.batch.duration[*],/usr/local/bin/infraops-batch-report --get "$1" duration
